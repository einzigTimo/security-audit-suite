name: Build & Release

# Produktiver Release ausschliesslich ueber die Develop Zentrale
# (DEPLOY-RICHTLINIE.md im Deployment-Controller): der Workflow laeuft nur mit
# einem frischen, HMAC-signierten Zentrale-Dispatch. Version kommt aus
# version.json (einzige Versionsquelle); der Tag sat-v<Version> wird NACH dem
# gruenen Build vom Release gesetzt, nicht mehr von Hand gepusht.

on:
  workflow_dispatch:
    inputs:
      zentrale_run_id:
        description: 'Run-ID des frischen Develop-Zentrale-Preflights'
        required: true
        type: string
      zentrale_commit:
        description: 'Von der Develop Zentrale geprüfter Commit'
        required: true
        type: string
      zentrale_expires_at:
        description: 'Ablaufzeit der signierten Zentrale-Attestierung'
        required: true
        type: string
      zentrale_signature:
        description: 'HMAC-Signatur der Develop Zentrale'
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    if: ${{ github.event.inputs.zentrale_run_id != '' && github.event.inputs.zentrale_commit == github.sha && github.event.inputs.zentrale_signature != '' }}
    runs-on: windows-latest

    steps:
      - name: Signierte Develop-Zentrale-Attestierung pruefen
        shell: pwsh
        env:
          DEPLOY_GATE_KEY: ${{ secrets.DEPLOY_ZENTRALE_HMAC_KEY_SAS }}
          ZENTRALE_RUN_ID: ${{ github.event.inputs.zentrale_run_id }}
          ZENTRALE_COMMIT: ${{ github.event.inputs.zentrale_commit }}
          ZENTRALE_EXPIRES: ${{ github.event.inputs.zentrale_expires_at }}
          ZENTRALE_SIGNATURE: ${{ github.event.inputs.zentrale_signature }}
        run: |
          $ErrorActionPreference = 'Stop'
          if ([string]::IsNullOrWhiteSpace($env:DEPLOY_GATE_KEY)) { throw 'Deploy-Gate-Secret fehlt; kein Release.' }
          $key = [Convert]::FromBase64String($env:DEPLOY_GATE_KEY)
          $expires = [DateTimeOffset]::Parse($env:ZENTRALE_EXPIRES).ToUniversalTime()
          if ($expires -le [DateTimeOffset]::UtcNow -or $expires -gt [DateTimeOffset]::UtcNow.AddMinutes(12)) {
            throw 'Zentrale-Attestierung ist abgelaufen oder zeitlich unplausibel.'
          }
          $payload = "$env:ZENTRALE_RUN_ID|einzigTimo/security-audit-suite|release.yml|$env:ZENTRALE_COMMIT|$env:ZENTRALE_EXPIRES"
          $hmac = [Security.Cryptography.HMACSHA256]::new($key)
          try { $expected = [Convert]::ToHexString($hmac.ComputeHash([Text.Encoding]::UTF8.GetBytes($payload))).ToLowerInvariant() }
          finally { $hmac.Dispose(); [Array]::Clear($key, 0, $key.Length) }
          if (-not [Security.Cryptography.CryptographicOperations]::FixedTimeEquals(
            [Text.Encoding]::ASCII.GetBytes($expected),
            [Text.Encoding]::ASCII.GetBytes($env:ZENTRALE_SIGNATURE.ToLowerInvariant()))) {
            throw 'HMAC-Signatur der Develop Zentrale ist ungueltig.'
          }
          Write-Host 'OK: signierter und frischer Develop-Zentrale-Dispatch.'

      - name: Quellcode auschecken
        uses: actions/checkout@v4

      - name: Python einrichten
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Version aus version.json bestimmen
        id: ver
        shell: pwsh
        run: |
          $version = (Get-Content version.json -Raw | ConvertFrom-Json).version
          if ($version -notmatch '^\d+\.\d+\.\d+$') { throw "Ungueltige Version '$version' in version.json (SemVer erwartet)." }
          $tag = "sat-v$version"
          $vorhanden = git ls-remote origin "refs/tags/$tag"
          if ($vorhanden) { throw "Tag $tag existiert bereits - Version in version.json erhoehen." }
          "version=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          Write-Host "Version: $version"

      - name: Inno Setup installieren
        shell: pwsh
        run: choco install innosetup --no-progress -y

      - name: Setup bauen
        shell: pwsh
        run: powershell -ExecutionPolicy Bypass -File packaging\build.ps1 -Version "${{ steps.ver.outputs.version }}"

      - name: SHA-256 fuer Setup erzeugen
        shell: pwsh
        run: |
          $version = "${{ steps.ver.outputs.version }}"
          $setup = "dist\SecurityAuditSuite-$version-Setup.exe"
          if (-not (Test-Path $setup)) { throw "Setup nicht gefunden: $setup" }
          $hash = (Get-FileHash -Algorithm SHA256 $setup).Hash.ToLowerInvariant()
          "$hash  $(Split-Path -Leaf $setup)" | Set-Content -Path "$setup.sha256" -Encoding ascii

      - name: Release erstellen und Setup anhaengen
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = "${{ steps.ver.outputs.version }}"
          $tag = "sat-v$version"
          $setup = "dist\SecurityAuditSuite-$version-Setup.exe"
          $checksum = "$setup.sha256"
          if (-not (Test-Path $setup)) { throw "Setup nicht gefunden: $setup" }
          if (-not (Test-Path $checksum)) { throw "Checksumme nicht gefunden: $checksum" }
          gh release create "$tag" "$setup" "$checksum" `
            --target "$env:GITHUB_SHA" `
            --title "Security Audit Suite $version" `
            --notes "Automatisch gebautes Windows-Setup. Nur mit ausdruecklicher Testberechtigung verwenden." `
            --repo "${{ github.repository }}"
