name: Public readiness

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: public-readiness-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install exact dependencies
        run: python -m pip install -r requirements.txt -r requirements-dev.txt
      - name: Install bundled browser
        env:
          PLAYWRIGHT_BROWSERS_PATH: "0"
        run: python -m playwright install chromium
      - name: Public-readiness and privacy tests
        run: |
          python scripts/public_readiness.py
          python -m unittest discover -s quality -v
      - name: Local fixture self-test
        run: python selftest/verify.py
      - name: Package smoke build
        env:
          PLAYWRIGHT_BROWSERS_PATH: "0"
        run: pyinstaller --noconfirm --clean packaging/security-audit-suite.spec
